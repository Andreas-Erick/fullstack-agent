<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Siren Assistant: Siren in profile, singing, her hair flowing into the waves, a moon behind her.
       Behind her, two fading echoes of the same figure: the other personas she can be. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3a4a"/>
      <stop offset="1" stop-color="#040a14"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <clipPath id="tile"><rect x="32" y="32" width="960" height="960" rx="224"/></clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="softer" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="10"/></filter>
    <path id="hairShape" d="M600 280 C500 230 360 270 300 380 C250 470 260 560 200 640 C260 640 300 610 330 580 C330 650 300 720 240 780 C330 770 400 720 430 650 C450 720 440 790 400 850 C500 820 560 740 572 650 Z"/>
    <path id="faceShape" d="M600 280 C680 300 720 360 716 420 C714 450 740 470 760 500 C770 516 754 526 736 530 C744 548 740 566 726 572 C734 590 726 612 700 616 C690 650 660 670 614 666 C600 700 590 730 572 760 C560 720 556 680 560 650 C520 600 500 520 520 440 C540 360 560 300 600 280 Z"/>
    <!-- Her, whole: the hair and the face. An echo is this, faded as one (group opacity). -->
    <g id="her"><use href="#hairShape" fill="url(#hair)"/><use href="#faceShape" fill="#06202a"/></g>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="600" cy="452" r="212" fill="#f3e9c6" fill-opacity="0.9"/>
    <!-- Her echoes: the same Siren, further back, fainter and softer. -->
    <g opacity="0.2" filter="url(#softer)"><use href="#her" transform="translate(-62 48) scale(0.85)"/></g>
    <g opacity="0.42" filter="url(#soft)"><use href="#her" transform="translate(16 70) scale(0.85)"/></g>
    <!-- Siren herself, in front. -->
    <g transform="translate(92 92) scale(0.85)">
      <use href="#hairShape" fill="url(#hair)" stroke="#071a24" stroke-width="12" stroke-linejoin="round"/>
      <use href="#faceShape" fill="#06202a"/>
      <circle cx="820" cy="560" r="22" fill="#5eead4"/>
      <circle cx="868" cy="498" r="17" fill="#5eead4" fill-opacity="0.75"/>
      <circle cx="904" cy="436" r="12" fill="#5eead4" fill-opacity="0.5"/>
    </g>
    <path d="M0 872 Q160 832 288 872 T544 872 T800 872 T1024 862 L1024 1024 L0 1024 Z" fill="#0c5266" fill-opacity="0.92"/>
  </g>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="10"/>
</svg>
