# Dependency audit: on every push to main, on pull requests and weekly. Fails on known high or critical
# vulnerabilities in the packages the app ships (npm audit --omit=dev), and reports the rest.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Shipped dependencies (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Everything, including build tools (report only)
        if: always()
        run: npm audit || true
