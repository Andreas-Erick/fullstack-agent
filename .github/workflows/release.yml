# Builds Siren Assistant for Windows (setup .exe, .msi, portable .exe), macOS (Apple silicon and Intel:
# .dmg and .zip), Android phones and tablets (.apk) and Galaxy Watch / Wear OS (.apk), and attaches them to
# a GitHub Release.
# Trigger: push a version tag, e.g.  git tag v2.0.0 && git push origin v2.0.0
# (or run it by hand from the Actions tab: then the builds are kept as artifacts only).
# The tag should match "version" in package.json.
#
# Each desktop job runs the syntax/integrity check and the whole test suite on its own operating
# system first, so a platform-specific break stops the release.
#
# Code signing (optional; without the secrets the builds are unsigned / ad-hoc, as before):
#   Windows: WIN_CSC_LINK (the .pfx, base64-encoded) and WIN_CSC_KEY_PASSWORD → signed setup, MSI and
#            portable .exe (no "unknown publisher" warning once the certificate has a reputation).
#   macOS:   MAC_CSC_LINK (the Developer ID Application .p12, base64) and MAC_CSC_KEY_PASSWORD → signed with
#            the hardened runtime (build/entitlements.mac.plist); add APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD
#            and APPLE_TEAM_ID to notarize too. Without them: ad-hoc signed, not notarized; on first launch
#            macOS asks for confirmation (right-click the app → Open, or Privacy & Security → Open Anyway).
#
# Supply chain: every action is pinned to a commit (the tag in the comment); Dependabot proposes updates
# (.github/dependabot.yml) and security.yml audits the dependencies.
#
# Android signing (optional): add these repository secrets to get a signed release APK —
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded (base64 -w0 nexus-release.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the release gets a debug-signed APK (installable, but not upgradable to a signed one
# without uninstalling first). See android/README.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the installers

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no git token left on the runner for later steps

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build and publish installers
        run: npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signed when the secrets exist (electron-builder ignores them when empty).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Keep the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: siren-assistant-windows
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: error

  macos:
    # After the Windows job, so the release it created exists (no two jobs creating it at once).
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no git token left on the runner for later steps

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build and publish (Apple silicon and Intel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Secrets that aren't set arrive as empty variables; electron-builder on macOS takes an empty
        # CSC_LINK for a path ("… not a file"), so unset ones are removed before it runs.
        run: |
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac --publish "$PUBLISH"
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            echo "::warning::No macOS signing certificate set; publishing an ad-hoc signed build."
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish "$PUBLISH" -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi

      - name: Keep the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: siren-assistant-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  android:
    # After the Windows job, so the release it created exists to attach the APK to.
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no git token left on the runner for later steps

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NEXUS_VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          export NEXUS_VERSION="$VERSION"
          mkdir -p ../dist
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexus-release.jks"
            export NEXUS_KEYSTORE="$RUNNER_TEMP/nexus-release.jks"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../dist/Siren-Android-$VERSION.apk"
            cp wear/build/outputs/apk/release/wear-release.apk "../dist/Siren-Wear-$VERSION.apk"
            rm -f "$RUNNER_TEMP/nexus-release.jks"
          else
            echo "::warning::No Android signing secrets set; publishing a debug-signed APK."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../dist/Siren-Android-$VERSION-debug.apk"
            cp wear/build/outputs/apk/debug/wear-debug.apk "../dist/Siren-Wear-$VERSION-debug.apk"
          fi

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: siren-assistant-android
          path: dist/*.apk
          if-no-files-found: error
