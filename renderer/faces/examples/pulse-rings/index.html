<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pulse Rings</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; }
    </style>
    <script src="core.js"></script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      // Example custom face: a glowing orb with rings that ripple outward. The ripple speed follows
      // the agent's state, the inner ring becomes a waveform while it speaks, and arcs spin while it thinks.
      // Copy this folder, rename it, and edit — it appears in the Face gallery automatically.
      AV.init();
      const c = document.getElementById('c');
      const g = c.getContext('2d');
      const RINGS = 7;
      // Per state: ripple speed, brightness, orb breathing speed.
      const MOOD = {
        idle: [0.25, 0.7, 1.2], listening: [0.6, 0.9, 2], thinking: [0.9, 0.85, 3], working: [0.8, 0.85, 3],
        speaking: [0.5, 1, 2], happy: [1.2, 1, 3], sleeping: [0.08, 0.35, 0.6], alert: [0.7, 1, 4],
      };
      let w = 0, h = 0, dpr = 1, t = 0, phase = 0, spin = 0, level = 0, last = performance.now();

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        w = innerWidth;
        h = innerHeight;
        c.width = Math.round(w * dpr);
        c.height = Math.round(h * dpr);
      }
      addEventListener('resize', resize);
      resize();

      function rgba(hex, a) {
        const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})/i.exec(hex || '') || [0, '00', 'e5', 'ff'];
        return `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${a})`;
      }

      function frame(now) {
        requestAnimationFrame(frame);
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const [speed, bright, breath] = MOOD[AV.state] || MOOD.idle;
        const [main, accent] = AV.colors();
        level += ((AV.level || 0) - level) * Math.min(1, dt * 12);
        t += dt;
        phase += dt * speed;
        spin += dt * (AV.state === 'thinking' || AV.state === 'working' ? 2.2 : 0.3);

        const cx = w / 2, cy = h / 2;
        const R = Math.min(w, h) * 0.11;
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, w, h);

        // Ambient glow behind everything.
        const amb = g.createRadialGradient(cx, cy, R * 0.5, cx, cy, Math.max(w, h) * 0.55);
        amb.addColorStop(0, rgba(main, (0.14 + level * 0.2) * bright));
        amb.addColorStop(1, rgba(main, 0));
        g.fillStyle = amb;
        g.fillRect(0, 0, w, h);

        g.globalCompositeOperation = 'lighter';
        g.lineCap = 'round';

        // Rings drift outward and fade at the edge, so new ones are always being born at the orb.
        const spacing = R * 0.62;
        for (let i = 0; i < RINGS; i++) {
          const f = (i + (phase % 1)) / RINGS; // 0 at the orb, 1 at the outside
          const r = R * 1.5 + f * spacing * RINGS + level * R * 0.5 * (1 - f);
          const a = Math.sin(Math.PI * f) * 0.55 * bright;
          g.strokeStyle = rgba(i % 2 ? accent : main, a);
          g.lineWidth = 1 + (1 - f) * 2;
          g.shadowColor = rgba(main, a);
          g.shadowBlur = 14;
          g.beginPath();
          g.arc(cx, cy, r, 0, Math.PI * 2);
          g.stroke();
        }
        g.shadowBlur = 0;

        // Inner ring: a waveform while speaking, a gently breathing circle otherwise.
        const n = 128;
        const rr = R * 1.3;
        g.strokeStyle = rgba(main, 0.85 * bright);
        g.lineWidth = 2;
        g.shadowColor = rgba(main, 1);
        g.shadowBlur = 18;
        g.beginPath();
        for (let k = 0; k <= n; k++) {
          const ang = (k / n) * Math.PI * 2;
          const s = AV.samples?.[Math.floor(Math.abs((k / n) * 2 - 1) * 63)] || 0;
          const wobble = AV.state === 'speaking' ? s * R * 0.45 : Math.sin(ang * 6 + t * 1.5) * R * 0.02;
          const x = cx + Math.cos(ang) * (rr + wobble);
          const y = cy + Math.sin(ang) * (rr + wobble);
          k ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.stroke();
        g.shadowBlur = 0;

        // Spinning arcs (they speed up while thinking or working).
        for (let i = 0; i < 3; i++) {
          const a0 = spin * (i % 2 ? -1 : 1) + (i * Math.PI * 2) / 3;
          g.strokeStyle = rgba(accent, 0.7 * bright);
          g.lineWidth = 2.5;
          g.beginPath();
          g.arc(cx, cy, R * 1.12, a0, a0 + 0.9);
          g.stroke();
        }

        // The orb.
        const pulse = 1 + Math.sin(t * breath) * 0.04 + level * 0.25;
        const orb = g.createRadialGradient(cx, cy, 0, cx, cy, R * pulse);
        orb.addColorStop(0, rgba('#ffffff', 0.9 * bright));
        orb.addColorStop(0.3, rgba(main, 0.85 * bright));
        orb.addColorStop(0.75, rgba(accent, 0.3 * bright));
        orb.addColorStop(1, rgba(accent, 0));
        g.fillStyle = orb;
        g.beginPath();
        g.arc(cx, cy, R * pulse, 0, Math.PI * 2);
        g.fill();
        g.globalCompositeOperation = 'source-over';
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
