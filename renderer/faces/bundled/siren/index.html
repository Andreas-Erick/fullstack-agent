<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Siren — The Voice Beneath the Waves</title>
  <script src="core.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    /**
     * THE SIREN — THE VOICE BENEATH THE WAVES
     * Self-contained 2D Canvas character with procedural kinematics,
     * maritime artifacts, avian-nautical mythology, and full AV integration.
     */
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      // --- 1. AV INITIALIZATION & FALLBACKS ---
      const hasAV = typeof window.AV !== 'undefined' && window.AV !== null;
      if (hasAV && typeof window.AV.init === 'function') {
        try { window.AV.init(); } catch (e) {}
      }

      // Preview / Standalone fallback state so it starts asleep and wakes up naturally if opened directly
      let fallbackStartTime = performance.now();
      function getAV() {
        if (hasAV) {
          return {
            state: window.AV.state || 'idle',
            level: typeof window.AV.level === 'number' ? window.AV.level : 0,
            samples: Array.isArray(window.AV.samples) ? window.AV.samples : null,
            colors: typeof window.AV.colors === 'function' ? window.AV.colors() : ['#2dd4bf', '#38bdf8'],
            name: (window.AV.env && window.AV.env.name) ? window.AV.env.name : '',
            alert: (window.AV.env && window.AV.env.alert) ? window.AV.env.alert : null
          };
        }
        // Fallback when opened without core.js: start asleep briefly, then wake to idle
        const elapsed = (performance.now() - fallbackStartTime) * 0.001;
        return {
          state: elapsed < 1.2 ? 'sleeping' : 'idle',
          level: 0,
          samples: null,
          colors: ['#2dd4bf', '#38bdf8'],
          name: 'THE SIREN',
          alert: null
        };
      }

      // Reduced motion preference check
      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      let prefersReducedMotion = reducedMotionQuery.matches;
      reducedMotionQuery.addEventListener('change', (e) => {
        prefersReducedMotion = e.matches;
      });

      // --- 2. COLOR & MATH UTILITIES ---
      function hexToRgb(hex) {
        let h = (hex || '#2dd4bf').replace(/[^0-9a-fA-F]/g, '');
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        const num = parseInt(h, 16) || 0x2dd4bf;
        return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
      }

      function rgbToCss(rgb, alpha = 1) {
        return `rgba(${Math.round(rgb[0])},${Math.round(rgb[1])},${Math.round(rgb[2])},${alpha})`;
      }

      function mixRgb(a, b, t) {
        return [
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t
        ];
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function damp(current, target, lambda, dt) {
        return lerp(current, target, 1 - Math.exp(-lambda * dt));
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      // 2-bone Inverse Kinematics solver for graceful arms & talons
      function solveIK(x1, y1, x2, y2, L1, L2, bendDir) {
        let dx = x2 - x1;
        let dy = y2 - y1;
        let d = Math.hypot(dx, dy);
        const maxReach = (L1 + L2) * 0.992;
        const minReach = Math.abs(L1 - L2) + 2;
        if (d > maxReach) {
          dx = (dx / d) * maxReach;
          dy = (dy / d) * maxReach;
          d = maxReach;
        } else if (d < minReach) {
          dx = (dx / (d || 1)) * minReach;
          dy = (dy / (d || 1)) * minReach;
          d = minReach;
        }
        const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
        const mx = x1 + (a * dx) / d;
        const my = y1 + (a * dy) / d;
        const ex = mx + ((h * dy) / d) * bendDir;
        const ey = my - ((h * dx) / d) * bendDir;
        return { ex, ey, hx: x1 + dx, hy: y1 + dy };
      }

      // --- 3. CHARACTER & ENVIRONMENT STATE ---
      let width = 800;
      let height = 800;
      let dpr = 1;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      // Smoothed theme colors
      let mainRgb = [45, 212, 191];
      let accentRgb = [56, 189, 248];

      // State transition tracking
      let prevRawState = 'sleeping';
      let wakeTimer = 0; // > 0 while playing the 1.1s waking stretch animation
      let simTime = 0;
      let lastTimestamp = performance.now();

      // Blink & eye gaze timers
      let blinkTimer = 2.4;
      let blinkProgress = 0;
      let isBlinking = false;
      let gazeTargetX = 0;
      let gazeTargetY = 0;
      let nextGazeChange = 1.8;

      // Bell & astrolabe physics
      let bellAngle = -0.04;
      let bellVel = 0;
      let astrolabeAngleOuter = 0.3;
      let astrolabeAngleInner = -0.5;
      let astrolabeSpinSpeed = 0.15;

      // Smoothed kinematic pose targets & current values
      const pose = {
        torsoLeanX: -8,
        torsoArchY: 16,
        breath: 0,
        headX: -12,
        headY: -78,
        headTilt: -0.22,
        eyeOpen: 0,
        pupilX: 0,
        pupilY: 0,
        browLift: -0.2,
        browTilt: 0,
        smile: 0.05,
        mouthOpen: 0,
        mouthWidth: 18,
        wingSpread: -0.15,
        headWingCrest: 0,
        // Left hand (Screen Left / Character's Right Arm)
        lHandX: -95,
        lHandY: 36,
        lHandAngle: 0.2,
        lHandGesture: 0, // 0: rest, 1: cup ear, 2: open palm, 3: astrolabe, 4: point
        // Right hand (Screen Right / Character's Left Arm)
        rHandX: 62,
        rHandY: 34,
        rHandAngle: -0.2,
        rHandGesture: 0, // 0: rest, 1: chin, 2: lyre pluck, 3: open gesture, 4: heart/happy
        tailSway: 0,
        dreadShadow: 0,
        waterCalmness: 0.5,
        alertGlow: 0,
        sleepDim: 1
      };

      // Pre-allocated particles (motes, bubbles, sleep resonance runes)
      const NUM_MOTES = 22;
      const motes = [];
      for (let i = 0; i < NUM_MOTES; i++) {
        motes.push({
          x: (Math.random() - 0.5) * 560,
          y: (Math.random() - 0.5) * 540,
          r: 1.2 + Math.random() * 2.4,
          phase: Math.random() * Math.PI * 2,
          speed: 8 + Math.random() * 14,
          drift: (Math.random() - 0.5) * 12,
          isSleepNote: i < 4
        });
      }

      // Pre-allocated hair strands so no arrays are created per frame
      const hairStrands = [
        { ox: -36, oy: -125, len: 145, side: -1, width: 16, phase: 0.2 },
        { ox: -22, oy: -135, len: 165, side: -1, width: 14, phase: 1.1 },
        { ox: 20,  oy: -135, len: 160, side: 1,  width: 15, phase: 0.7 },
        { ox: 34,  oy: -122, len: 140, side: 1,  width: 13, phase: 1.9 },
        { ox: -10, oy: -138, len: 175, side: -0.5, width: 18, phase: 2.5 },
        { ox: 12,  oy: -138, len: 170, side: 0.5,  width: 17, phase: 3.1 }
      ];

      // --- 4. POSE COMPUTATION BY STATE ---
      function updateCharacterState(dt, rawDt, av) {
        const speedFactor = prefersReducedMotion ? 0.22 : 1.0;
        simTime += dt * speedFactor;

        // Smoothly interpolate theme colors
        const targetMain = hexToRgb(av.colors[0] || '#2dd4bf');
        const targetAccent = hexToRgb(av.colors[1] || '#38bdf8');
        mainRgb = mixRgb(mainRgb, targetMain, 1 - Math.exp(-5 * rawDt));
        accentRgb = mixRgb(accentRgb, targetAccent, 1 - Math.exp(-5 * rawDt));

        // Detect transition out of 'sleeping' into any awake state -> trigger waking stretch
        const curState = av.state || 'idle';
        if (prevRawState === 'sleeping' && curState !== 'sleeping') {
          wakeTimer = 1.15;
        }
        prevRawState = curState;

        if (wakeTimer > 0) {
          wakeTimer = Math.max(0, wakeTimer - rawDt);
        }

        const effectiveState = wakeTimer > 0 ? 'waking' : curState;
        const level = clamp(av.level || 0, 0, 1);
        const t = simTime;

        // Subtle organic rhythms (tide sway & breathing)
        const breathCycle = Math.sin(t * (effectiveState === 'sleeping' ? 1.1 : 1.85));
        const tideSway = Math.sin(t * 0.95) * 4.5 + Math.cos(t * 0.61) * 2.2;

        // Default target values (Idle baseline)
        let tTorsoLeanX = tideSway * 0.65 - 3; // Slight asymmetrical lounge on the rock
        let tTorsoArchY = breathCycle * 3.5;
        let tHeadX = tTorsoLeanX * 1.15 + Math.sin(t * 0.7) * 2.5;
        let tHeadY = -88 + breathCycle * 3;
        let tHeadTilt = -0.05 + Math.sin(t * 0.55) * 0.045;
        let tEyeOpen = 1.0;
        let tBrowLift = 0;
        let tBrowTilt = 0;
        let tSmile = 0.22;
        let tMouthOpen = 0;
        let tMouthWidth = 18;
        let tWingSpread = 0.08 + breathCycle * 0.05;
        let tHeadWingCrest = Math.sin(t * 1.3) * 0.06;

        // Default resting hands:
        // Left hand rests on worn basalt patch; Right hand rests near the shipwreck lyre
        let tLHandX = -102 + Math.sin(t * 0.9) * 3;
        let tLHandY = 38 + breathCycle * 2;
        let tLHandAngle = 0.15;
        let tLHandGesture = 0;

        let tRHandX = 68 + Math.cos(t * 0.85) * 3;
        let tRHandY = 26 + breathCycle * 2;
        let tRHandAngle = -0.15;
        let tRHandGesture = 0;

        let tWaterCalmness = 0.35;
        let tAlertGlow = 0;
        let tSleepDim = 0;
        let tAstroSpeed = 0.18;

        // --- Blink & Random Gaze Logic ---
        if (effectiveState !== 'sleeping') {
          blinkTimer -= rawDt;
          if (blinkTimer <= 0 && !isBlinking) {
            isBlinking = true;
            blinkProgress = 0;
            blinkTimer = 2.6 + Math.random() * 3.8;
          }
          if (isBlinking) {
            blinkProgress += rawDt * 9.5;
            if (blinkProgress >= Math.PI) {
              isBlinking = false;
              blinkProgress = 0;
            }
          }
          nextGazeChange -= rawDt;
          if (nextGazeChange <= 0) {
            nextGazeChange = 1.8 + Math.random() * 3.2;
            if (effectiveState === 'idle') {
              // Birdlike curiosity glances or looking down into the water
              const r = Math.random();
              if (r < 0.35) {
                gazeTargetX = (Math.random() - 0.5) * 9;
                gazeTargetY = (Math.random() - 0.4) * 5;
              } else if (r < 0.55) {
                // Glance toward the astrolabe or silent bell
                gazeTargetX = -6;
                gazeTargetY = 4;
              } else {
                // Direct hypnotic gaze at user
                gazeTargetX = 0;
                gazeTargetY = 0;
              }
            }
          }
        } else {
          isBlinking = false;
        }

        let tPupilX = gazeTargetX;
        let tPupilY = gazeTargetY;

        // --- State-Specific Expressions & Kinematics ---
        switch (effectiveState) {
          case 'sleeping': {
            tTorsoLeanX = -11 + Math.sin(t * 0.6) * 2;
            tTorsoArchY = 16 + breathCycle * 4.5;
            tHeadX = -18 + Math.sin(t * 0.6) * 2.5;
            tHeadY = -72 + breathCycle * 4.5;
            tHeadTilt = -0.26 + Math.sin(t * 0.5) * 0.03;
            tEyeOpen = 0.0;
            tSmile = 0.08;
            tWingSpread = -0.18 + breathCycle * 0.03;
            tHeadWingCrest = -0.25;
            tLHandX = -94;
            tLHandY = 44;
            tRHandX = 52;
            tRHandY = 38;
            tWaterCalmness = 0.65;
            tSleepDim = 1.0;
            tAstroSpeed = 0.03;
            break;
          }

          case 'waking': {
            // 1.15s stretch & head-shake into wakefulness
            const p = 1 - (wakeTimer / 1.15); // 0 -> 1
            const stretchArch = Math.sin(p * Math.PI);
            tTorsoLeanX = lerp(-11, -2, p);
            tTorsoArchY = lerp(16, -12, stretchArch);
            tHeadX = lerp(-18, 0, p) + Math.sin(p * Math.PI * 3) * 4 * stretchArch;
            tHeadY = -88 - stretchArch * 10;
            tHeadTilt = lerp(-0.26, 0.12, stretchArch);
            tEyeOpen = p < 0.35 ? 0.15 : lerp(0.15, 1.08, (p - 0.35) / 0.65);
            tMouthOpen = stretchArch * 0.48; // Gentle waking sigh/yawn
            tMouthWidth = 15;
            tWingSpread = 0.58 * stretchArch; // Full avian-fin stretch
            tHeadWingCrest = 0.45 * stretchArch;
            // Arms stretching outward and upward before settling
            tLHandX = lerp(-94, -142, stretchArch);
            tLHandY = lerp(44, -48, stretchArch);
            tLHandGesture = 2;
            tRHandX = lerp(52, 138, stretchArch);
            tRHandY = lerp(38, -52, stretchArch);
            tRHandGesture = 3;
            tSleepDim = 1 - p;
            break;
          }

          case 'listening': {
            // Leaning forward intently, birdlike head tilt, left hand cupped near ear/feather crest
            tTorsoLeanX = 6 + Math.sin(t * 1.2) * 2;
            tTorsoArchY = -6 + breathCycle * 2;
            tHeadX = 11 + Math.sin(t * 1.1) * 1.5;
            tHeadY = -92 + breathCycle * 2;
            tHeadTilt = 0.21 + Math.sin(t * 1.5) * 0.03 + level * 0.08;
            tEyeOpen = 1.08;
            tPupilX = 0;
            tPupilY = -1;
            tBrowLift = 0.32 + level * 0.2;
            tBrowTilt = 0.12;
            tSmile = 0.28;
            tMouthOpen = level * 0.12;
            tWingSpread = 0.24 + level * 0.18;
            tHeadWingCrest = 0.42 + level * 0.35; // Feathers perk up to catch every sound
            // Left hand raised and cupped by her ear
            tLHandX = -56 - level * 6;
            tLHandY = -82 + Math.sin(t * 2.2) * 2;
            tLHandAngle = -0.45;
            tLHandGesture = 1; // Cupped ear pose
            // Right hand poised delicately over the lyre strings
            tRHandX = 82;
            tRHandY = -2;
            tRHandGesture = 2;
            tWaterCalmness = 0.85; // Water stills as she listens intently
            tAstroSpeed = 0.35 + level * 0.8;
            break;
          }

          case 'thinking': {
            // Unusually still, listening beneath the surface; right hand to chin, eyes up, tapping fingers
            tTorsoLeanX = -4 + Math.sin(t * 0.5) * 1;
            tTorsoArchY = 2;
            tHeadX = -6;
            tHeadY = -89;
            tHeadTilt = -0.14 + Math.sin(t * 0.8) * 0.02;
            tEyeOpen = 0.86;
            tPupilX = -4 + Math.sin(t * 0.9) * 3;
            tPupilY = -6; // Looking upward / deep in contemplation
            tBrowLift = 0.15;
            tBrowTilt = -0.25; // Inquisitive asymmetric arch
            tSmile = 0.12;
            tWingSpread = 0.04;
            tHeadWingCrest = 0.18 + Math.sin(t * 3.5) * 0.08;
            // Right hand raised to her chin
            tRHandX = 18;
            tRHandY = -44 + Math.sin(t * 5.2) * 1.8; // Subtle finger tap on chin
            tRHandAngle = -0.6;
            tRHandGesture = 1;
            // Left hand tapping fingers on the weathered rock near the astrolabe
            tLHandX = -108;
            tLHandY = 34 - Math.abs(Math.sin(t * 4.5)) * 5;
            tLHandGesture = 0;
            tWaterCalmness = 0.96; // The sea becomes unnaturally still when she concentrates
            tAstroSpeed = 1.65; // Astrolabe rings spin thoughtfully
            break;
          }

          case 'working': {
            // Busy hands: turning the engraved bronze astrolabe & plucking/tuning the shipwreck lyre
            tTorsoLeanX = -2 + Math.sin(t * 2.1) * 4;
            tTorsoArchY = -3 + Math.cos(t * 2.1) * 2;
            tHeadX = -8 + Math.sin(t * 1.9) * 14; // Glancing between astrolabe (left) and lyre (right)
            tHeadY = -85;
            tHeadTilt = Math.sin(t * 1.9) * 0.14;
            tEyeOpen = 0.95;
            tPupilX = Math.sin(t * 1.9) * 7;
            tPupilY = 5; // Looking down at her instruments
            tBrowLift = 0.1;
            tBrowTilt = -0.15;
            tSmile = 0.25;
            tWingSpread = 0.22 + Math.sin(t * 3.8) * 0.08;
            tHeadWingCrest = 0.3;
            // Left hand manipulating the floating/mounted bronze astrolabe
            tLHandX = -124 + Math.cos(t * 4.2) * 14;
            tLHandY = -6 + Math.sin(t * 4.2) * 14;
            tLHandAngle = Math.sin(t * 4.2) * 0.4;
            tLHandGesture = 3;
            // Right hand actively weaving across the lyre strings / charting
            tRHandX = 92 + Math.sin(t * 5.1) * 16;
            tRHandY = -8 + Math.cos(t * 3.7) * 18;
            tRHandAngle = Math.cos(t * 5.1) * 0.35;
            tRHandGesture = 2;
            tWaterCalmness = 0.25;
            tAstroSpeed = 3.6; // Fast mechanical rotation
            break;
          }

          case 'speaking': {
            // Hypnotic vocal cadence: mouth follows AV.level, hands gesture with non-repeating organic math
            const gWave1 = Math.sin(t * 2.7) * 0.6 + Math.sin(t * 4.3) * 0.4;
            const gWave2 = Math.cos(t * 2.1) * 0.6 + Math.sin(t * 3.6) * 0.4;
            const voiceBoost = 0.25 + level * 0.95;

            tTorsoLeanX = 2 + gWave1 * 5 * voiceBoost;
            tTorsoArchY = -4 - level * 6 + breathCycle * 2;
            tHeadX = 3 + gWave2 * 6 * voiceBoost;
            tHeadY = -91 - level * 5;
            tHeadTilt = gWave1 * 0.12 + (level > 0.45 ? 0.08 : -0.03);
            tEyeOpen = 1.0 + level * 0.12;
            tPupilX = gWave2 * 2.5;
            tPupilY = -1;
            tBrowLift = 0.2 + level * 0.45;
            tBrowTilt = gWave1 * 0.1;
            tSmile = 0.32 + level * 0.2;
            tMouthOpen = clamp(level * 1.25 + (level > 0.04 ? 0.08 + Math.sin(t * 16) * 0.08 : 0), 0, 1);
            tMouthWidth = 18 + Math.sin(t * 9) * 2.5 + level * 4;
            tWingSpread = 0.2 + level * 0.48 + gWave1 * 0.08;
            tHeadWingCrest = 0.25 + level * 0.55;

            // Expressive, non-repeating two-handed gestures that rise on louder passages
            tLHandX = -82 + gWave1 * 28 * voiceBoost - level * 18;
            tLHandY = 6 - level * 58 + gWave2 * 18 * voiceBoost;
            tLHandAngle = -0.3 + gWave1 * 0.45;
            tLHandGesture = level > 0.52 ? 4 : 2; // Pointing/invoking on loud peaks, open palm otherwise

            tRHandX = 76 + gWave2 * 26 * voiceBoost + level * 16;
            tRHandY = 4 - level * 52 + gWave1 * 20 * voiceBoost;
            tRHandAngle = 0.25 + gWave2 * 0.45;
            tRHandGesture = 3; // Graceful open hand

            tWaterCalmness = 0.15;
            tAstroSpeed = 0.6 + level * 1.8;
            break;
          }

          case 'happy': {
            // Warm, knowing melodic delight: rhythmic nod/bounce, glowing smile, graceful hand to heart/lyre
            const bounce = Math.abs(Math.sin(t * 4.2));
            const nod = Math.sin(t * 5.5);
            tTorsoLeanX = Math.sin(t * 2.1) * 4;
            tTorsoArchY = -8 - bounce * 6;
            tHeadX = Math.sin(t * 2.1) * 5;
            tHeadY = -92 - bounce * 5 + nod * 3.5;
            tHeadTilt = 0.14 + Math.sin(t * 2.8) * 0.08;
            tEyeOpen = 0.72; // Happy crescent eyes
            tPupilX = 0;
            tPupilY = 0;
            tBrowLift = 0.38;
            tSmile = 0.88;
            tMouthOpen = 0.24 + bounce * 0.12;
            tMouthWidth = 22;
            tWingSpread = 0.42 + bounce * 0.18;
            tHeadWingCrest = 0.5 + bounce * 0.15;

            // Left hand rests warmly over her sternum/pearl collar; Right hand gives an appreciative flourish
            tLHandX = -18 + Math.sin(t * 3) * 4;
            tLHandY = -22 - bounce * 4;
            tLHandAngle = 0.4;
            tLHandGesture = 2;

            tRHandX = 88 + Math.cos(t * 3.2) * 10;
            tRHandY = -28 - bounce * 8;
            tRHandAngle = -0.35;
            tRHandGesture = 4;
            tAstroSpeed = 1.1;
            break;
          }

          case 'alert': {
            // Sitting straight up, wide supernatural eyes, flared wings, silent ship's bell swaying
            const pulse = Math.sin(t * 6.0); // Safe < 3Hz oscillation
            tTorsoLeanX = 0;
            tTorsoArchY = -14;
            tHeadX = 0;
            tHeadY = -98;
            tHeadTilt = 0.02 * pulse;
            tEyeOpen = 1.28; // Wide alert eyes
            tPupilX = 0;
            tPupilY = 0;
            tBrowLift = 0.48;
            tBrowTilt = 0.28;
            tSmile = -0.15; // Serious, ancient composure
            tMouthOpen = 0.18;
            tMouthWidth = 16;
            tWingSpread = 0.65 + pulse * 0.06; // Full intimidating wing flare
            tHeadWingCrest = 0.75;

            // Hands poised in warding / attentive readiness
            tLHandX = -96;
            tLHandY = -24 + pulse * 3;
            tLHandAngle = -0.5;
            tLHandGesture = 2;

            tRHandX = 94;
            tRHandY = -22 - pulse * 3;
            tRHandAngle = 0.5;
            tRHandGesture = 3;

            tAlertGlow = 1.0;
            tWaterCalmness = 0.05;
            tAstroSpeed = 2.8;
            // Drive the silent ship's bell to sway unnaturally
            bellVel += Math.cos(t * 3.8) * 1.8 * dt;
            break;
          }

          case 'idle':
          default: {
            // Subtle birdlike head tilts when something catches her eye
            if (Math.abs(gazeTargetX) > 4) {
              tHeadTilt += gazeTargetX * 0.018;
            }
            break;
          }
        }

        // Apply blink closure on top of target eye openness
        if (isBlinking && effectiveState !== 'sleeping') {
          tEyeOpen *= Math.max(0.02, 1 - Math.sin(blinkProgress));
        }

        // Smooth all pose channels over ~0.5s (lambda = 7.5) so state transitions never jump
        const easeLambda = 7.5;
        pose.torsoLeanX = damp(pose.torsoLeanX, tTorsoLeanX, easeLambda, rawDt);
        pose.torsoArchY = damp(pose.torsoArchY, tTorsoArchY, easeLambda, rawDt);
        pose.breath = breathCycle;
        pose.headX = damp(pose.headX, tHeadX, easeLambda, rawDt);
        pose.headY = damp(pose.headY, tHeadY, easeLambda, rawDt);
        pose.headTilt = damp(pose.headTilt, tHeadTilt, easeLambda, rawDt);
        pose.eyeOpen = damp(pose.eyeOpen, tEyeOpen, 14, rawDt);
        pose.pupilX = damp(pose.pupilX, tPupilX, 9, rawDt);
        pose.pupilY = damp(pose.pupilY, tPupilY, 9, rawDt);
        pose.browLift = damp(pose.browLift, tBrowLift, easeLambda, rawDt);
        pose.browTilt = damp(pose.browTilt, tBrowTilt, easeLambda, rawDt);
        pose.smile = damp(pose.smile, tSmile, easeLambda, rawDt);
        pose.mouthOpen = damp(pose.mouthOpen, tMouthOpen, 18, rawDt); // Responsive to voice
        pose.mouthWidth = damp(pose.mouthWidth, tMouthWidth, 12, rawDt);
        pose.wingSpread = damp(pose.wingSpread, tWingSpread, easeLambda, rawDt);
        pose.headWingCrest = damp(pose.headWingCrest, tHeadWingCrest, easeLambda, rawDt);

        pose.lHandX = damp(pose.lHandX, tLHandX, easeLambda, rawDt);
        pose.lHandY = damp(pose.lHandY, tLHandY, easeLambda, rawDt);
        pose.lHandAngle = damp(pose.lHandAngle, tLHandAngle, easeLambda, rawDt);
        pose.lHandGesture = tLHandGesture;

        pose.rHandX = damp(pose.rHandX, tRHandX, easeLambda, rawDt);
        pose.rHandY = damp(pose.rHandY, tRHandY, easeLambda, rawDt);
        pose.rHandAngle = damp(pose.rHandAngle, tRHandAngle, easeLambda, rawDt);
        pose.rHandGesture = tRHandGesture;

        pose.waterCalmness = damp(pose.waterCalmness, tWaterCalmness, 4, rawDt);
        pose.alertGlow = damp(pose.alertGlow, tAlertGlow, 6, rawDt);
        pose.sleepDim = damp(pose.sleepDim, tSleepDim, 4, rawDt);

        // Update silent ship's bell pendulum physics (moves gently in invisible currents)
        const bellTarget = Math.sin(t * 1.15) * 0.08 * (1 - pose.waterCalmness * 0.7);
        const bellForce = (bellTarget - bellAngle) * 3.5;
        bellVel = (bellVel + bellForce * dt) * Math.exp(-1.5 * dt);
        bellAngle += bellVel * dt;

        // Update engraved navigational astrolabe rotation
        astrolabeSpinSpeed = damp(astrolabeSpinSpeed, tAstroSpeed, 5, rawDt);
        astrolabeAngleOuter += astrolabeSpinSpeed * dt;
        astrolabeAngleInner -= astrolabeSpinSpeed * 1.35 * dt;

        // Update floating sea motes & sleep notes
        for (let i = 0; i < NUM_MOTES; i++) {
          const m = motes[i];
          m.y -= m.speed * dt * (1 - pose.waterCalmness * 0.45);
          m.x += Math.sin(t * 1.2 + m.phase) * m.drift * dt;
          if (m.y < -280) {
            m.y = 260;
            m.x = (Math.random() - 0.5) * 520;
          }
        }
      }

        ctx.fillStyle = skinGrad;
        ctx.strokeStyle = '#536875';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-14 + pose.headX * 0.7, -75 + ty);
        ctx.lineTo(14 + pose.headX * 0.7, -75 + ty);
        ctx.lineTo(22 + tx, -40 + ty);
        ctx.lineTo(-22 + tx, -40 + ty);

        // Upper Torso & Shoulders
        ctx.beginPath();
        ctx.moveTo(-45 + tx, -38 + ty);
        ctx.quadraticCurveTo(tx, -46 + ty, 45 + tx, -38 + ty);
        ctx.bezierCurveTo(42 + tx, -5 + ty, 32, 16, 35, 30);
        ctx.quadraticCurveTo(0, 38, -35, 30);
        ctx.bezierCurveTo(-32, 16, -42 + tx, -5 + ty, -45 + tx, -38 + ty);

        ctx.quadraticCurveTo(14 + tx, -29 + ty, 3 + tx, -33 + ty);

        // Ancient Sea-Silk Greek Chiton (Asymmetrical: fastened on her left shoulder with an engraved bronze fibula, frayed hem)
        const chitonGrad = ctx.createLinearGradient(-35 + tx, -40 + ty, 30, 38);

        chitonGrad.addColorStop(0.6, '#12222e');

        ctx.fillStyle = chitonGrad;
        ctx.strokeStyle = 'rgba(180, 210, 225, 0.3)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        // Fastened at right-screen shoulder (34 + tx, -39 + ty), draping diagonally across chest
        ctx.moveTo(26 + tx, -41 + ty);

        ctx.bezierCurveTo(38 + tx, -2 + ty, 36, 18, 38, 32);
        // Irregular frayed hem at the hip
        ctx.lineTo(18, 38);
        ctx.lineTo(12, 33);
        ctx.lineTo(-4, 39);
        ctx.lineTo(-15, 33);
        ctx.lineTo(-37, 34);
        ctx.bezierCurveTo(-35, 12, -36 + tx, -8 + ty, -28 + tx, -18 + ty);
        ctx.quadraticCurveTo(2 + tx, -14 + ty, 26 + tx, -41 + ty);
        ctx.closePath();
        ctx.fill();

        // Natural folds in the wet chiton fabric
        ctx.strokeStyle = rgbToCss(mainRgb, 0.22);
        ctx.beginPath();
        ctx.moveTo(31 + tx, -35 + ty);
        ctx.quadraticCurveTo(12 + tx, 0 + ty * 0.5, -10, 34);
        ctx.moveTo(35 + tx, -25 + ty);
        ctx.quadraticCurveTo(22 + tx, 5 + ty * 0.5, 14, 35);

        ctx.arc(33 + tx, -38 + ty, 5.5, 0, Math.PI * 2);

        ctx.strokeStyle = '#8c734b';

        for (let p = -2; p <= 2; p++) {
          const px = tx + p * 6.5;
          const py = -21 + ty - Math.abs(p) * 1.8;
          ctx.fillStyle = p === 0 ? rgbToCss(mainRgb, 0.95) : '#e6f0f2';
          ctx.beginPath();
          ctx.arc(px, py, p === 0 ? 3.2 : 2.1, 0, Math.PI * 2);

      // 5F. The Siren's Head, Sculptural Face, Feathered Ear-Crests & Crown of Artifacts
      function drawSirenHead(av) {
        ctx.save();
        ctx.translate(pose.headX, pose.headY);
        ctx.rotate(pose.headTilt);

        const level = clamp(av.level || 0, 0, 1);

        // 1. Bilateral Avian Ear-Wings (perk up when listening, flare when alert)
        const crestAngle = pose.headWingCrest;
        for (let side = -1; side <= 1; side += 2) {
          ctx.save();
          ctx.translate(side * 28, -4);
          ctx.scale(side, 1);
          ctx.rotate(0.15 + crestAngle * 0.45);

          for (let f = 0; f < 4; f++) {
            ctx.save();
            ctx.rotate(-0.25 + f * 0.22);
            const len = 36 - f * 5;
            ctx.fillStyle = '#172636';
            ctx.strokeStyle = rgbToCss(f === 0 ? mainRgb : accentRgb, 0.65);
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(len * 0.5, -7, len, -2);
            ctx.quadraticCurveTo(len * 0.6, 6, 0, 4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
          ctx.restore();
        }

        // 2. Sculpted Grecian Face Contour (worn smooth like an ancient marble statue)
        const faceGrad = ctx.createRadialGradient(-6, -12, 5, 0, -4, 42);
        faceGrad.addColorStop(0, '#e3eef2');
        faceGrad.addColorStop(0.65, '#bfd0d9');
        faceGrad.addColorStop(1, '#849ca8');

        ctx.fillStyle = faceGrad;
        ctx.strokeStyle = '#4e6370';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-27, -18);
        ctx.bezierCurveTo(-29, 4, -18, 22, 0, 27); // Chin
        ctx.bezierCurveTo(18, 22, 29, 4, 27, -18);
        ctx.bezierCurveTo(26, -38, -26, -38, -27, -18);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Subtle hairline salt-weathering mark on her left cheekbone (classical statue imperfection)
        ctx.strokeStyle = 'rgba(90, 112, 125, 0.35)';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(15, 2);
        ctx.lineTo(21, 6);
        ctx.lineTo(19, 10);
        ctx.stroke();

        // 3. Eyes (Haunting, Luminous Deep-Sea Eyes with Expressive Lids)
        const eyeOpen = clamp(pose.eyeOpen, 0, 1.35);
        for (let side = -1; side <= 1; side += 2) {
          const ex = side * 11.5;
          const ey = -5;

          ctx.save();
          ctx.translate(ex, ey);

          if (eyeOpen <= 0.08) {
            // Closed sleeping / blinking eye with long dark lashes
            ctx.strokeStyle = '#1b2833';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(-7, 0);
            ctx.quadraticCurveTo(0, 3.5, 7, 0);
            ctx.stroke();
            // Delicate lash tips
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(-5, 1.5); ctx.lineTo(-6.5, 4);
            ctx.moveTo(0, 2.2);  ctx.lineTo(0, 5);
            ctx.moveTo(5, 1.5);  ctx.lineTo(6.5, 4);
            ctx.stroke();
          } else {
            const h = 4.6 * eyeOpen;
            // Dark pelagic sclera
            ctx.fillStyle = '#101c26';
            ctx.beginPath();
            ctx.moveTo(-7.5, 0);
            ctx.quadraticCurveTo(0, -h * 1.15, 7.5, 0);
            ctx.quadraticCurveTo(0, h * 0.95, -7.5, 0);
            ctx.closePath();
            ctx.fill();

            // Clip to eye almond for iris & pupil
            ctx.save();
            ctx.clip();

            const px = clamp(pose.pupilX, -3.5, 3.5);
            const py = clamp(pose.pupilY, -2.5, 2.5);

            // Luminous bioluminescent iris (matches theme color)
            ctx.fillStyle = rgbToCss(mainRgb, 0.95);
            ctx.beginPath();
            ctx.arc(px, py, 3.9, 0, Math.PI * 2);
            ctx.fill();

            // Inner accent ring
            ctx.strokeStyle = rgbToCss(accentRgb, 0.8);
            ctx.lineWidth = 1;
            ctx.stroke();

            // Deep pupil (dilates slightly when listening/speaking)
            ctx.fillStyle = '#05080c';
            ctx.beginPath();
            ctx.arc(px, py, 1.7 + level * 0.5, 0, Math.PI * 2);
            ctx.fill();

            // Moonlight catchlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(px - 1.3, py - 1.3, 1.05, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Upper eyelid crease & winged lash line
            ctx.strokeStyle = '#111b24';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(-8, 0.5);
            ctx.quadraticCurveTo(0, -h * 1.2, 8.5 * side > 0 ? 8.5 : 8, -0.5);
            ctx.stroke();
          }

          // Eyebrows (expressive tilt & lift)
          const bLift = pose.browLift * 4;
          const bTilt = pose.browTilt * side * 3;
          ctx.strokeStyle = '#182634';
          ctx.lineWidth = 1.7;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-7.5, -7.5 - bLift + bTilt);
          ctx.quadraticCurveTo(0, -10.5 - bLift, 7.5, -7.5 - bLift - bTilt);
          ctx.stroke();

          ctx.restore();
        }

        // 4. Classical Grecian Nose Bridge
        ctx.strokeStyle = '#5c7482';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(-1.5, -6);
        ctx.lineTo(-2.5, 5.5);
        ctx.quadraticCurveTo(0, 7.5, 2.5, 5.5);
        ctx.stroke();

        // 5. The Mouth (Sings & Speaks with AV.level)
        const mOpen = clamp(pose.mouthOpen, 0, 1);
        const mSmile = pose.smile;
        const mHalfW = pose.mouthWidth * 0.5;
        const my = 15;

        ctx.save();
        ctx.translate(0, my);

        if (mOpen > 0.04) {
          // Open singing / speaking mouth with subtle bioluminescent vocal resonance inside
          const openH = 1.5 + mOpen * 8.5;
          ctx.fillStyle = '#1b1624';
          ctx.strokeStyle = '#4e6370';
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(-mHalfW, -mSmile * 2.5);
          ctx.quadraticCurveTo(0, -openH * 0.55, mHalfW, -mSmile * 2.5);
          ctx.quadraticCurveTo(0, openH * 1.15, -mHalfW, -mSmile * 2.5);
          ctx.closePath();
          ctx.fill();

          // Subtle inner vocal glow when speaking loudly
          if (level > 0.1) {
            ctx.fillStyle = rgbToCss(mainRgb, level * 0.45);
            ctx.beginPath();
            ctx.arc(0, openH * 0.2, openH * 0.45, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.stroke();
        } else {
          // Closed / smiling sculptural lips
          ctx.fillStyle = 'rgba(105, 132, 148, 0.55)';
          ctx.beginPath();
          ctx.moveTo(-mHalfW, -mSmile * 2);
          ctx.quadraticCurveTo(0, -2.5, mHalfW, -mSmile * 2);
          ctx.quadraticCurveTo(0, 3.2 + mSmile * 2, -mHalfW, -mSmile * 2);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#3f5361';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-mHalfW, -mSmile * 2.2);
          ctx.quadraticCurveTo(0, mSmile * 2.8, mHalfW, -mSmile * 2.2);
          ctx.stroke();
        }
        ctx.restore();

        // 6. Forehead Hair Framing & Ancient Maritime Diadem (Weathered Bronze, Coral & Compass Star)
        ctx.fillStyle = '#0f1924';
        ctx.strokeStyle = rgbToCss(mainRgb, 0.3);
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(-28, -12);
        ctx.quadraticCurveTo(-18, -28, 0, -24);
        ctx.quadraticCurveTo(18, -28, 28, -12);
        ctx.quadraticCurveTo(31, -38, 0, -40);
        ctx.quadraticCurveTo(-31, -38, -28, -12);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Crown / Diadem forged from an engraved navigational compass rose & deep-sea coral branches
        ctx.strokeStyle = '#a68953';
        ctx.fillStyle = '#594728';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-25, -24);
        ctx.quadraticCurveTo(0, -34, 25, -24);
        ctx.quadraticCurveTo(0, -28, -25, -24);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Delicate coral-and-bronze spires on the crown (slightly asymmetrical from centuries underwater)
        const spires = [
          { x: -16, h: 12, tilt: -0.2 },
          { x: -8,  h: 18, tilt: -0.08 },
          { x: 0,   h: 25, tilt: 0 },
          { x: 8,   h: 17, tilt: 0.1 },
          { x: 16,  h: 10, tilt: 0.25 } // Slightly chipped right spire
        ];
        for (let i = 0; i < spires.length; i++) {
          const sp = spires[i];
          ctx.strokeStyle = i === 2 ? rgbToCss(mainRgb, 0.9) : '#9c8252';
          ctx.lineWidth = i === 2 ? 2 : 1.4;
          ctx.beginPath();
          ctx.moveTo(sp.x, -28);
          ctx.lineTo(sp.x + Math.sin(sp.tilt) * sp.h, -28 - sp.h);
          ctx.stroke();
        }

        // Central luminous pearl / compass star in the diadem
        ctx.fillStyle = rgbToCss(mainRgb, 0.95);
        ctx.beginPath();
        ctx.arc(0, -31, 3.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // 5G. Articulated Arms & Graceful Feathered-Talon Hands (IK Driven)
      function drawArmsAndHands() {
        const tx = pose.torsoLeanX;
        const ty = pose.torsoArchY;

        const lShoulderX = -40 + tx;
        const lShoulderY = -34 + ty;
        const rShoulderX = 40 + tx;
        const rShoulderY = -34 + ty;

        // Solve 2-bone IK for both arms
        const leftIK = solveIK(lShoulderX, lShoulderY, pose.lHandX, pose.lHandY, 54, 52, -1);
        const rightIK = solveIK(rShoulderX, rShoulderY, pose.rHandX, pose.rHandY, 54, 52, 1);

        drawSingleArm(lShoulderX, lShoulderY, leftIK, pose.lHandAngle, pose.lHandGesture, -1);
        drawSingleArm(rShoulderX, rShoulderY, rightIK, pose.rHandAngle, pose.rHandGesture, 1);
      }

      function drawSingleArm(sx, sy, ik, handAngle, gesture, side) {
        ctx.save();

        // Upper Arm (sculpted marble-toned skin)
        ctx.strokeStyle = '#b4c6cf';
        ctx.lineWidth = 11;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ik.ex, ik.ey);
        ctx.stroke();

        // Engraved Greek spiral bronze armlet on upper left arm
        if (side === -1) {
          const mx = lerp(sx, ik.ex, 0.52);
          const my = lerp(sy, ik.ey, 0.52);
          ctx.strokeStyle = '#9c804b';
          ctx.lineWidth = 3.2;
          ctx.beginPath();
          ctx.arc(mx, my, 6.2, 0, Math.PI * 1.4);
          ctx.stroke();
        }

        // Forearm (transitions smoothly from pale marble skin to dark pelagic-feathered wrist)
        const foreGrad = ctx.createLinearGradient(ik.ex, ik.ey, ik.hx, ik.hy);
        foreGrad.addColorStop(0, '#adc0ca');
        foreGrad.addColorStop(0.55, '#466173');
        foreGrad.addColorStop(1, '#182836');

        ctx.strokeStyle = foreGrad;
        ctx.lineWidth = 9.5;
        ctx.beginPath();
        ctx.moveTo(ik.ex, ik.ey);
        ctx.lineTo(ik.hx, ik.hy);
        ctx.stroke();

        // Delicate forearm fin-feathers along outer ulna edge
        ctx.fillStyle = rgbToCss(mainRgb, 0.35);
        ctx.strokeStyle = rgbToCss(accentRgb, 0.5);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(ik.ex, ik.ey);
        ctx.quadraticCurveTo(
          (ik.ex + ik.hx) * 0.5 + side * 14,
          (ik.ey + ik.hy) * 0.5 + 8,
          ik.hx, ik.hy
        );
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Elegant Talon-Tipped Hand
        ctx.save();
        ctx.translate(ik.hx, ik.hy);
        const forearmAngle = Math.atan2(ik.hy - ik.ey, ik.hx - ik.ex);
        ctx.rotate(forearmAngle + handAngle);

        // Palm
        ctx.fillStyle = '#1b2c3b';
        ctx.strokeStyle = rgbToCss(mainRgb, 0.55);
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.ellipse(6, 0, 8, 5.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 4 Articulated Graceful Fingers with iridescent tips (pose varies by gesture)
        for (let f = 0; f < 4; f++) {
          let fSpread = (f - 1.5) * 0.22;
          let fLen = 13 - Math.abs(f - 1.5) * 2.2;
          if (gesture === 1) {
            // Cupped ear / chin rest: curved together
            fSpread *= 0.45;
            fLen *= 0.82;
          } else if (gesture === 4 && f === 1) {
            // Pointing / invoking finger extended
            fLen = 16.5;
          } else if (gesture === 4 && f > 1) {
            fLen *= 0.65;
          }

          ctx.save();
          ctx.translate(11, (f - 1.5) * 2.2);
          ctx.rotate(fSpread);
          ctx.strokeStyle = '#243a4d';
          ctx.lineWidth = 2.1;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(fLen * 0.5, side * -1.5, fLen, 0);
          ctx.stroke();

          // Luminous talon tip
          ctx.fillStyle = rgbToCss(mainRgb, 0.9);
          ctx.beginPath();
          ctx.arc(fLen, 0, 1.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Opposable thumb
        ctx.strokeStyle = '#243a4d';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(4, -side * 4);
        ctx.lineTo(11, -side * 8);
        ctx.stroke();

        ctx.restore();
        ctx.restore();
      }

      // 5H. Foreground Dark Water, Submerged Dread Silhouette & Audio-Reactive Waveform Ripples
      function drawForegroundWaterAndWaveform(av) {
        const level = clamp(av.level || 0, 0, 1);
        const calm = pose.waterCalmness;
        const waterY = 152;

        ctx.save();

        // 1. Subtle Dread: Distant shipwreck prow or leviathan silhouette drifting beneath the surface
        const dreadCycle = Math.sin(simTime * 0.32);
        if (dreadCycle > -0.2) {
          const dreadAlpha = clamp((dreadCycle + 0.2) * 0.14, 0, 0.13);
          const dreadX = Math.cos(simTime * 0.18) * 75;
          ctx.fillStyle = `rgba(6, 12, 18, ${dreadAlpha})`;
          ctx.strokeStyle = rgbToCss(accentRgb, dreadAlpha * 0.7);
          ctx.lineWidth = 1;
          ctx.beginPath();
          // Submerged broken Greek trireme prow & ram silhouette beneath the waves
          ctx.moveTo(dreadX - 95, waterY + 45);
          ctx.quadraticCurveTo(dreadX - 20, waterY + 22, dreadX + 65, waterY + 32);
          ctx.lineTo(dreadX + 85, waterY + 20);
          ctx.lineTo(dreadX + 72, waterY + 42);
          ctx.lineTo(dreadX + 90, waterY + 46); // Bronze naval ram profile
          ctx.quadraticCurveTo(dreadX, waterY + 58, dreadX - 95, waterY + 45);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        // 2. Concentric Audio-Reactive Water Ripples & AV.samples Waveform
        const samples = av.samples;
        const numRipples = 3;
        for (let r = 0; r < numRipples; r++) {
          const phase = (simTime * 0.65 + r / numRipples) % 1;
          const rx = 185 + phase * 95 + level * 35;
          const ry = 16 + phase * 18;
          const alpha = (1 - phase) * (0.28 + level * 0.45);

          ctx.strokeStyle = rgbToCss(r % 2 === 0 ? mainRgb : accentRgb, alpha);
          ctx.lineWidth = 1.4 + level * 1.5;
          ctx.beginPath();
          ctx.ellipse(0, waterY + 12 + r * 8, rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Live 64-sample Waveform across the water surface when speaking or listening
        ctx.strokeStyle = rgbToCss(mainRgb, 0.65 + level * 0.35);
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        const waveSpan = 420;
        const numPts = 64;
        for (let i = 0; i < numPts; i++) {
          const frac = i / (numPts - 1);
          const wx = (frac - 0.5) * waveSpan;
          const edgeFade = Math.sin(frac * Math.PI); // Smoothly taper at both ends

          let sampleVal = 0;
          if (samples && samples.length > i && (av.state === 'speaking' || level > 0.02)) {
            sampleVal = samples[i] * (18 + level * 22);
          } else {
            // Gentle natural sea swell attenuated by pose.waterCalmness
            sampleVal = Math.sin(simTime * 2.1 + i * 0.25) * 4.5 * (1 - calm * 0.78)
                      + Math.sin(simTime * 12 + i * 0.6) * level * 16;
          }

          const wy = waterY + sampleVal * edgeFade;
          if (i === 0) ctx.moveTo(wx, wy);
          else ctx.lineTo(wx, wy);
        }
        ctx.stroke();

        // Second harmonic shimmer line beneath the primary wave
        ctx.strokeStyle = rgbToCss(accentRgb, 0.35 + level * 0.3);
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let i = 0; i < numPts; i += 2) {
          const frac = i / (numPts - 1);
          const wx = (frac - 0.5) * (waveSpan * 0.88);
          const edgeFade = Math.sin(frac * Math.PI);
          const wy = waterY + 14 + Math.cos(simTime * 1.8 - i * 0.3) * 3.5 * (1 - calm * 0.75) * edgeFade;
          if (i === 0) ctx.moveTo(wx, wy);
          else ctx.lineTo(wx, wy);
        }
        ctx.stroke();

        // 3. Floating Sea-Motes & Sleeping Musical Runes ('z' / ancient Greek notes)
        for (let i = 0; i < NUM_MOTES; i++) {
          const m = motes[i];
          if (m.isSleepNote) {
            if (pose.sleepDim > 0.15) {
              const noteAlpha = pose.sleepDim * (0.55 - Math.abs(m.y) / 300);
              if (noteAlpha > 0.02) {
                ctx.fillStyle = rgbToCss(mainRgb, noteAlpha);
                ctx.font = `${Math.round(12 + m.r * 3)}px Georgia, serif`;
                ctx.fillText(i % 2 === 0 ? 'z' : '♪', m.x * 0.35, m.y * 0.5 - 85);
              }
            }
          } else {
            const moteAlpha = (0.28 + Math.sin(simTime * 2 + m.phase) * 0.15) * (1 - Math.abs(m.y) / 280);
            if (moteAlpha > 0.02) {
              ctx.fillStyle = rgbToCss(i % 2 === 0 ? mainRgb : accentRgb, moteAlpha);
              ctx.beginPath();
              ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        // 4. Subtle Engraved Nameplate & Alert Banner on the Basalt Plinth
        const bannerText = av.alert ? av.alert : (av.name || '');
        if (bannerText) {
          ctx.font = '600 11px Georgia, "Times New Roman", serif';
          ctx.textAlign = 'center';
          ctx.letterSpacing = '2px';
          ctx.fillStyle = av.alert
            ? rgbToCss(mainRgb, 0.92)
            : 'rgba(180, 200, 212, 0.42)';
          const truncated = bannerText.length > 38 ? bannerText.slice(0, 35) + '...' : bannerText;
          ctx.fillText(truncated.toUpperCase(), 0, waterY + 42);
        }

        ctx.restore();
      }

      // --- 6. MAIN ANIMATION LOOP ---
      function render(timestamp) {
        const rawDt = clamp((timestamp - lastTimestamp) * 0.001, 0.001, 0.1);
        lastTimestamp = timestamp;
        const dt = prefersReducedMotion ? rawDt * 0.25 : rawDt;

        const av = getAV();
        updateCharacterState(dt, rawDt, av);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.scale(dpr, dpr);

        // Center the 620x620 virtual stage in any window size (from 160x160 to 4K) without clipping
        const stageSize = 620;
        const scale = Math.min(width / stageSize, height / stageSize);
        ctx.translate(width * 0.5, height * 0.5 + 18 * scale);
        ctx.scale(scale, scale);

        // Dim slightly when sleeping
        ctx.globalAlpha = 1 - pose.sleepDim * 0.28;

        // Draw layers back-to-front
        drawBackAuraAndRearWreckage(av);
        drawSirenWings();
        drawBackHair();
        drawSanctuaryRockAndProps(av);
        drawSirenBodyAndDrapery();
        drawSirenHead(av);
        drawArmsAndHands();
        drawForegroundWaterAndWaveform(av);

        ctx.restore();
        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
