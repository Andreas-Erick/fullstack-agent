<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'none'; frame-src 'none'; base-uri 'none'"
    />
    <title>Document</title>
    <link rel="stylesheet" href="app://bundle/node_modules/@fontsource/exo-2/400.css" />
    <link rel="stylesheet" href="app://bundle/node_modules/@fontsource/exo-2/600.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app://bundle/node_modules/marked/lib/marked.umd.js"></script>
    <script src="app://bundle/node_modules/dompurify/dist/purify.min.js"></script>
    <script type="module" src="js/viewer.js"></script>
  </head>
  <body class="doc-popup">
    <header class="doc-bar">
      <span class="doc-kind" id="docKind">DOC</span>
      <div class="doc-name"><b id="docName">Opening…</b><small id="docPath"></small></div>
      <div class="doc-actions" id="docCtl"></div>
    </header>
    <main class="doc-viewer" id="popupViewer" tabindex="-1"></main>
    <footer class="doc-foot" id="docFoot"></footer>
    <div id="toasts" class="toasts"></div>
  </body>
</html>
